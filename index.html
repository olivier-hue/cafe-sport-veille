async function fetchOgData(url) {
  const titreInput = document.getElementById('titre');
  const imgInput = document.getElementById('image_url');
  
  try {
    titreInput.placeholder = "⚡ Récupération express...";
    
    // On utilise un proxy ultra-léger qui renvoie juste le code HTML brut instantanément
    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
    if (!res.ok) throw new Error("Proxy error");
    
    const html = await res.text();
    
    // Nos Regex faites maison pour lire le HTML
    const getMeta = (prop) => {
      const match = html.match(new RegExp(`<meta[^>]*property=["'](?:og:)?${prop}["'][^>]*content=["']([^"']+)["']`, 'i')) ||
                    html.match(new RegExp(`<meta[^>]*name=["'](?:og:)?${prop}["'][^>]*content=["']([^"']+)["']`, 'i'));
      return match ? match[1].replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>') : null;
    };

    const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
    const standardTitle = titleMatch ? titleMatch[1] : null;

    // Extraction
    const foundTitle = getMeta('title') || standardTitle;
    const foundImage = getMeta('image');
    
    // Remplissage
    if (foundTitle && !titreInput.value) {
      titreInput.value = foundTitle.trim();
    }
    if (foundImage && !imgInput.value) {
      imgInput.value = foundImage.trim();
    }
  } catch (e) {
    console.error("Erreur lors de la récupération express", e);
  } finally {
    // On remet le placeholder d'origine si on n'a rien trouvé
    if (!titreInput.value) {
      titreInput.placeholder = "Saisir le titre (ex: post LinkedIn)...";
    }
  }
}

function suggestFromUrl(rawUrl) {
  try {
    const u = new URL(rawUrl);
    const host = u.hostname.replace(/^www\./, '');
    const full = (host + u.pathname + ' ' + u.search).toLowerCase();
    let lang = '';
    if (host.endsWith('.de')||host.endsWith('.at')) lang='(de)';
    else if (host.endsWith('.it')) lang='(it)';
    else if (host.endsWith('.es')) lang='(es)';
    else if (host.endsWith('.nl')) lang='(nl)';
    else if (host.endsWith('.co.uk')||host.endsWith('.com.au')) lang='(en)';
    else { for (const [d,l] of Object.entries(DOMAIN_LANG)) { if (host===d||host.endsWith('.'+d)) { lang=l; break; } } }
    let ind = '';
    if (/youtube\.com|youtu\.be|dailymotion\.com/.test(host)) ind='📽️';
    else if (/spotify\.com|podcasts\.apple\.com|soundcloud\.com|deezer\.com/.test(host)) ind='🎙️';
    else if ((host.includes('lequipe.fr')&&/plus|abonne/.test(u.pathname))||/wsj\.com|ft\.com|theathletic\.com/.test(host)) ind='💰';
    let contract = '';
    for (const [rx,c] of CONTRACT_RULES) { if (rx.test(full)) { contract=c; break; } }
    for (const [d,c] of Object.entries(DOMAIN_CAT)) {
      if (host===d||host.endsWith('.'+d)) return { cat:c, lang, ind, contract, confidence:'full' };
    }
    for (const [rx,c] of SLUG_RULES) {
      if (rx.test(full)) return { cat:c, lang, ind, contract, confidence:'partial' };
    }
    return { cat:'', lang, ind, contract, confidence:'none' };
  } catch { return { cat:'', lang:'', ind:'', contract:'', confidence:'none' }; }
}

function cleanUrl(url) {
  try {
    const u = new URL(url);
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid','ref','source','rcm'].forEach(p => u.searchParams.delete(p));
    return u.toString().replace(/[?&]$/, '');
  } catch { return url; }
}

// ── État ──────────────────────────────────────────────────────────────
let entries = [];
let selEmoji = '', selContract = '';
const syncBadge = document.getElementById('sync-badge');

function setSync(state, msg) {
  syncBadge.textContent = msg || '';
  syncBadge.className = 'sync-badge' + (state ? ' ' + state : '');
}

// ── Supabase load ─────────────────────────────────────────────────────
async function loadEntries() {
  try {
    setSync('syncing', '↻ chargement…');
    entries = await sbGet();
    setSync('', '');
  } catch(e) {
    setSync('error', '⚠ connexion');
    entries = [];
  }
  renderList();
}

// ── Indicateurs ───────────────────────────────────────────────────────
function setEmoji(val) {
  selEmoji = val;
  document.querySelectorAll('#grp-emoji .ind-btn').forEach(b => b.classList.toggle('ae', b.dataset.val===val));
}
function setContract(val) {
  selContract = val;
  document.querySelectorAll('#grp-contract .ind-btn').forEach(b => b.classList.toggle('ac', b.dataset.val===val));
  if (val) document.getElementById('categorie').value = 'Emploi';
}
document.getElementById('grp-emoji').addEventListener('click', e => { const b=e.target.closest('.ind-btn'); if(b) setEmoji(b.dataset.val); });
document.getElementById('grp-contract').addEventListener('click', e => { const b=e.target.closest('.ind-btn'); if(b) setContract(b.dataset.val); });

// ── URL input ─────────────────────────────────────────────────────────
const urlInput = document.getElementById('url');
const addBtn   = document.getElementById('add-btn');
const hint     = document.getElementById('hint');

function applyDetection(url) {
  const { cat, lang, ind, contract, confidence } = suggestFromUrl(url);
  if (lang) document.getElementById('langue').value = lang;
  if (ind) setEmoji(ind);
  if (contract) setContract(contract);
  if (cat) {
    document.getElementById('categorie').value = cat;
    hint.textContent = (confidence==='full' ? '✓ ' : '~ ') + cat;
    hint.className = 'hint ' + (confidence==='full' ? 'full' : 'partial');
  } else { hint.className = 'hint'; }
}

function resetForm() {
  urlInput.value = ''; 
  document.getElementById('titre').value = ''; // NOUVEAU
  document.getElementById('image_url').value = ''; // NOUVEAU
  document.getElementById('langue').value = ''; 
  catSel.value = '';
  setEmoji(''); setContract(''); addBtn.disabled = true; hint.className = 'hint';
}

urlInput.addEventListener('paste', e => {
  setTimeout(() => {
    const cleaned = cleanUrl(urlInput.value.trim());
    urlInput.value = cleaned; addBtn.disabled = !cleaned;
    applyDetection(cleaned);
      if (cleaned) {
      fetchOgData(cleaned);
    }
  }, 10);
});
urlInput.addEventListener('input', () => { addBtn.disabled = !urlInput.value.trim(); hint.className = 'hint'; });

// ── Ajouter ───────────────────────────────────────────────────────────
addBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim(); if (!url) return;
  addBtn.disabled = true;
  const row = {
    url,
    title: document.getElementById('titre').value.trim() || null, // NOUVEAU
    image_url: document.getElementById('image_url').value.trim() || null, // NOUVEAU
    langue: document.getElementById('langue').value,
    indicateur: [selEmoji, selContract].filter(Boolean).join(' '),
    categorie: document.getElementById('categorie').value,
    position: entries.length ? Math.max(...entries.map(e => e.position || 0)) + 1 : 1,
  };
  try {
    setSync('syncing', '↻ sauvegarde…');
    const [saved] = await sbInsert(row);
    entries.push(saved);
    setSync('', '');
    renderList();
    resetForm();
  } catch(e) {
    setSync('error', '⚠ erreur sauvegarde');
    addBtn.disabled = false;
  }
});

// ── Vider ─────────────────────────────────────────────────────────────
document.getElementById('clear-btn').addEventListener('click', () => {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal"><p class="modal-title">Vider la liste ?</p><p class="modal-sub">Cette action supprimera tous les articles.</p><div class="modal-actions"><button class="modal-cancel">Annuler</button><button class="modal-confirm">Vider</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('.modal-cancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('.modal-confirm').addEventListener('click', async () => {
    overlay.remove();
    try {
      setSync('syncing', '↻ suppression…');
      await sbDeleteAll();
      entries = [];
      setSync('', '');
      renderList();
    } catch(e) { setSync('error', '⚠ erreur suppression'); }
  });
});

// ── Rendu ─────────────────────────────────────────────────────────────
function renderList() {
  const el     = document.getElementById('entry-list');
  const wrap   = document.getElementById('copy-wrap');
  const clearB = document.getElementById('clear-btn');
  document.getElementById('list-title').textContent = entries.length ? 'Liste (' + entries.length + ')' : 'Liste';
  clearB.style.display = entries.length ? '' : 'none';
  if (!entries.length) {
    el.innerHTML = '<div class="empty-state">Aucun article ajouté pour l\'instant</div>';
    wrap.style.display = 'none'; return;
  }
  wrap.style.display = 'block';
  el.innerHTML = entries.map((e) => {
    const domain = (() => { try { return new URL(e.url).hostname.replace(/^www\./,''); } catch { return e.url; } })();
    const ind = e.indicateur || '';
    const ctr = (ind.match(/CDI|CDD|Freelance|Alternance|Stage/) || [''])[0];
    const emj = ind.replace(/CDI|CDD|Freelance|Alternance|Stage/g,'').trim();
    return '<div class="entry" data-id="' + e.id + '">'
      + '<div class="entry-badges">'
      + (e.langue ? '<span class="badge">' + e.langue + '</span>' : '')
      + (emj ? '<span class="badge">' + emj + '</span>' : '')
      + (ctr ? '<span class="badge ctr">' + ctr + '</span>' : '')
      + (e.categorie ? '<span class="badge cat">' + e.categorie + '</span>' : '')
      + '</div>'
      + '<span class="entry-url" title="' + e.url + '">' + domain + '</span>'
      + '<a href="' + e.url + '" target="_blank" rel="noopener" class="entry-link" aria-label="Ouvrir">'
      + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>'
      + '</a>'
      + '<button class="del-btn" data-id="' + e.id + '" aria-label="Supprimer">'
      + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>'
      + '</button></div>';
  }).join('');

  el.querySelectorAll('.del-btn').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.dataset.id;
      b.disabled = true;
      try {
        setSync('syncing', '↻');
        await sbDelete(id);
        entries = entries.filter(e => e.id !== id);
        setSync('', '');
        renderList();
      } catch(e) { setSync('error', '⚠ erreur'); b.disabled = false; }
    });
  });
}

// ── Copier TSV ────────────────────────────────────────────────────────
document.getElementById('copy-btn').addEventListener('click', () => {
  const tsv = entries.map(e => 
    (e.title ? e.title.replace(/\t|\n/g, ' ') : '') + '\t' + 
    (e.langue || '') + '\t' + 
    (e.indicateur || '') + '\t' + 
    e.url + '\t' + 
    (e.categorie || '') + ' '
  ).join('\n');
  
  navigator.clipboard.writeText(tsv).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('ok');
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copié !';
    setTimeout(() => {
      btn.classList.remove('ok');
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copier le TSV pour Google Sheets';
    }, 2000);
  });
});

// ── Init ──────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
const params = new URLSearchParams(window.location.search);
const prefilledUrl = params.get('url');
if (prefilledUrl) {
  const cleaned = cleanUrl(prefilledUrl);
  urlInput.value = cleaned;
  addBtn.disabled = false;
  applyDetection(cleaned);
}
loadEntries();
</script>
