<script>
const SB_URL = 'https://htufjjctlblfbmysyofx.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0dWZqamN0bGJsZmJteXN5b2Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NDI3ODgsImV4cCI6MjA5NDMxODc4OH0.hb3DJWap4MKG8rnkI1AsDmKqrAuubQEZKpYbDD4px2I';
const HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
const SB_BUCKET = 'pdfs';

async function uploadPdfToSupabase(file, onProgress) {
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = Date.now() + '_' + safeName;
  await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SB_URL + '/storage/v1/object/' + SB_BUCKET + '/' + encodeURIComponent(path));
    xhr.setRequestHeader('apikey', SB_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SB_KEY);
    xhr.setRequestHeader('Content-Type', 'application/pdf');
    xhr.setRequestHeader('x-upsert', 'false');
    if (onProgress) xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error('Storage ' + xhr.status + ': ' + xhr.responseText));
    };
    xhr.onerror = () => reject(new Error('Erreur réseau upload'));
    xhr.send(file);
  });
  return SB_URL + '/storage/v1/object/public/' + SB_BUCKET + '/' + encodeURIComponent(path);
}

/** Début de la journée locale (navigateur), en ISO UTC pour PostgREST. */
function startOfTodayIso() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
  return start.toISOString();
}

/** Tous les articles encore visibles dans la liste de saisie (sans filtre de date). */
async function sbGet() {
  const qs =
    'select=*' +
    '&is_published=eq.true' +
    '&saisie_visible=eq.true' +
    '&order=created_at.desc';
  const r = await fetch(SB_URL + '/rest/v1/articles?' + qs, {
    headers: { ...HEADERS, 'Range': '0-9999', 'Prefer': 'count=exact' },
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/** Articles du jour encore visibles (utilisé par Actualiser pour fusionner). */
async function sbGetToday() {
  const since = startOfTodayIso();
  const qs =
    'select=*' +
    '&is_published=eq.true' +
    '&saisie_visible=eq.true' +
    '&created_at=gte.' + encodeURIComponent(since) +
    '&order=created_at.desc';
  const r = await fetch(SB_URL + '/rest/v1/articles?' + qs, {
    headers: { ...HEADERS, 'Range': '0-9999', 'Prefer': 'count=exact' },
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/** Masque tous les articles visibles de la liste de saisie (partout), sans dépublier. */
async function sbClearSaisieList() {
  const qs = 'saisie_visible=eq.true';
  const r = await fetch(SB_URL + '/rest/v1/articles?' + qs, {
    method: 'PATCH',
    headers: HEADERS,
    body: JSON.stringify({ saisie_visible: false }),
  });
  if (!r.ok) throw new Error(await r.text());
}
async function sbInsert(row) {
  const r = await fetch(SB_URL + '/rest/v1/articles', { method: 'POST', headers: HEADERS, body: JSON.stringify(row) });
  if (!r.ok) {
    const text = await r.text();
    const err = new Error(text);
    err.status = r.status;
    err.body = text;
    throw err;
  }
  return r.json();
}
async function sbUpdate(id, patch) {
  const r = await fetch(SB_URL + '/rest/v1/articles?id=eq.' + encodeURIComponent(id), {
    method: 'PATCH', headers: HEADERS, body: JSON.stringify(patch),
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(id) {
  const r = await fetch(SB_URL + '/rest/v1/articles?id=eq.' + encodeURIComponent(id), { method: 'DELETE', headers: HEADERS });
  if (!r.ok) throw new Error(await r.text());
}
async function sbCheckDuplicate(url) {
  const r = await fetch(
    SB_URL + '/rest/v1/articles?url=eq.' + encodeURIComponent(url) +
    '&select=id,url,title,categorie,indicateur,langue,image_url,is_published',
    { headers: HEADERS }
  );
  if (!r.ok) throw new Error(await r.text());
  const data = await r.json();
  return data[0] || null;
}
function isUniqueViolation(err) {
  const body = (err && (err.body || err.message)) || '';
  return /23505|duplicate key|unique/i.test(String(body));
}

async function fetchOgData(url) {
  const titreInput = document.getElementById('titre');
  const imgInput = document.getElementById('image_url');
  try {
    titreInput.placeholder = '⏳ Récupération par Microlink (2-3s)...';
    const res = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
    const json = await res.json();
    if (json.status === 'success' && json.data) {
      if (json.data.title && !titreInput.value) titreInput.value = json.data.title;
      if (json.data.image?.url && !imgInput.value) imgInput.value = json.data.image.url;
    }
  } catch (e) {
    console.error('Erreur Microlink', e);
  } finally {
    if (!titreInput.value) titreInput.placeholder = 'Saisir le titre (ex: post LinkedIn)...';
  }

function suggestFromUrl(rawUrl) {
  try {
    const u = new URL(rawUrl);
    const host = u.hostname.replace(/^www\./, '');
    const full = (host + u.pathname + ' ' + u.search).toLowerCase();
    let lang = '';
    if (host.endsWith('.de')||host.endsWith('.at')) lang='(de)';
    else if (host.endsWith('.it')) lang='(it)';
    else if (host.endsWith('.es')) lang='(es)';
    else if (host.endsWith('.nl')) lang='(nl)';
    else if (host.endsWith('.co.uk')||host.endsWith('.com.au')) lang='(en)';
    else { for (const [d,l] of Object.entries(DOMAIN_LANG)) { if (host===d||host.endsWith('.'+d)) { lang=l; break; } } }
    let ind = '';
    if (/youtube\.com|youtu\.be|dailymotion\.com/.test(host)) ind='📽️';
    else if (/spotify\.com|podcasts\.apple\.com|soundcloud\.com|deezer\.com/.test(host)) ind='🎙️';
    else if ((host.includes('lequipe.fr')&&/plus|abonne/.test(u.pathname))||/wsj\.com|ft\.com|theathletic\.com/.test(host)) ind='💰';
    let contract = '';
    for (const [rx,c] of CONTRACT_RULES) { if (rx.test(full)) { contract=c; break; } }
    let country = '';
    for (const [d,c] of Object.entries(DOMAIN_COUNTRY)) { if (host===d||host.endsWith('.'+d)) { country=c; break; } }
    if (!country) { for (const [t,c] of TLD_COUNTRY) { if (host.endsWith(t)) { country=c; break; } } }
    for (const [d,c] of Object.entries(DOMAIN_CAT)) {
      if (host===d||host.endsWith('.'+d)) return { cat:c, lang, ind, contract, country, confidence:'full' };
    }
    for (const [rx,c] of SLUG_RULES) {
      if (rx.test(full)) return { cat:c, lang, ind, contract, country, confidence:'partial' };
    }
    return { cat:'', lang, ind, contract, country, confidence:'none' };
  } catch { return { cat:'', lang:'', ind:'', contract:'', country:'', confidence:'none' }; }
}

function cleanUrl(url) {
  try {
    const u = new URL(url);
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid','ref','source','rcm'].forEach(p => u.searchParams.delete(p));
    return u.toString().replace(/[?&]$/, '');
  } catch { return url; }
}

function confirmModal({ title, sub, confirmLabel }) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal">' +
      '<p class="modal-title">' + title + '</p>' +
      '<p class="modal-sub">' + sub + '</p>' +
      '<div class="modal-actions">' +
      '<button type="button" class="modal-cancel">Annuler</button>' +
      '<button type="button" class="modal-confirm">' + (confirmLabel || 'Confirmer') + '</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
    const close = (val) => { overlay.remove(); resolve(val); };
    overlay.querySelector('.modal-cancel').addEventListener('click', () => close(false));
    overlay.querySelector('.modal-confirm').addEventListener('click', () => close(true));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
  });
}

  if (contract) setContract(contract);

    hint.className = 'hint ' + (confidence === 'full' ? 'full' : 'partial');

  syncColC();

function parseIndicateur(raw) {
  const ind = String(raw || '');
  const contracts = ['CDI', 'CDD', 'Freelance', 'Alternance', 'Stage'];
  let contract = '';
  for (const c of contracts) {
    if (ind.includes(c)) { contract = c; break; }
  }
  const emoji = ind.replace(/CDI|CDD|Freelance|Alternance|Stage/g, '').trim();
  return { emoji, contract };
}

let urlCheckTimeout;
async function handleUrlChange() {
  const url = urlInput.value.trim();
  const cleaned = cleanUrl(url);
  if (url !== cleaned && cleaned !== '') urlInput.value = cleaned;
  clearDupState();
  if (!cleaned) {
    addBtn.disabled = true;
    hint.className = 'hint';
    return;
  }
  applyDetection(cleaned);
  setSync('syncing', '↻ vérification…');
  try {
    const existing = await sbCheckDuplicate(cleaned);
    if (existing) {
      setSync('', '');
      hint.textContent = '⚠ Déjà en base';
      hint.className = 'hint danger';
      showDupBanner(existing);
      if (existing.title && !document.getElementById('titre').value) {
        document.getElementById('titre').value = existing.title;
      }
      if (existing.categorie) catSel.value = existing.categorie;
      if (existing.langue) {
        if (isEmploi()) setCountry(existing.langue);
        else document.getElementById('langue').value = existing.langue;
      }
      syncColC();
      return;
    }
    setSync('', '');
    addBtn.disabled = false;
    setAddMode('add');
    fetchOgData(cleaned);
  } catch (e) {
    setSync('error', '⚠ erreur réseau');
  }
}

addBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  if (!url) return;
  addBtn.disabled = true;
  const fields = buildPayload();
  try {
    if (pendingDup && pendingDup.id) {
      setSync('syncing', '↻ mise à jour…');
      const patch = { ...fields, is_published: true, saisie_visible: true };
      const [updated] = await sbUpdate(pendingDup.id, patch);
      const idx = entries.findIndex(e => e.id === pendingDup.id);
      if (idx >= 0 && updated) entries[idx] = { ...entries[idx], ...updated };
      else if (updated) {
        entries = [updated, ...entries.filter(e => e.id !== updated.id)];
      }
      setSync('', '');
      renderList();
      resetForm();
      return;
    }

    const row = {
      url,
      ...fields,
      is_published: true,
      saisie_visible: true,
      position: entries.length ? Math.max(...entries.map(e => e.position || 0), 0) + 1 : 1,
    };

    setSync('syncing', '↻ publication…');
    try {
      const [saved] = await sbInsert(row);
      entries = [saved, ...entries];
      setSync('', '');
      renderList();
      resetForm();
    } catch (insertErr) {
      if (isUniqueViolation(insertErr)) {
        const existing = await sbCheckDuplicate(url);
        if (existing) {
          setSync('', '');
          hint.textContent = '⚠ Déjà en base';
          hint.className = 'hint danger';
          showDupBanner(existing);
          addBtn.disabled = false;
          return;
        }
      }
      throw insertErr;
    }
  } catch (e) {
    console.error(e);
    setSync('error', '⚠ erreur sauvegarde');
    addBtn.disabled = false;
  }
});

});

async function deleteArticle(id) {
  const entry = entries.find(e => e.id === id);
  const label = entry?.title || entry?.url || 'cet article';
  const ok = await confirmModal({
    title: 'Supprimer cet article ?',
    sub: '« ' + String(label).slice(0, 80) + ' » sera retiré de la base et de l\'app (dépublication).',
    confirmLabel: 'Supprimer',
  });
  if (!ok) return;
  try {
    setSync('syncing', '↻ suppression…');
    await sbDelete(id);
    entries = entries.filter(e => e.id !== id);
    if (pendingDup && pendingDup.id === id) resetForm();
    setSync('', '');
    renderList();
  } catch (e) {
    console.error(e);
    setSync('error', '⚠ erreur suppression');
  }
}

function renderList() {
  const el = document.getElementById('entry-list');
  const wrap = document.getElementById('copy-wrap');
  const clearB = document.getElementById('clear-btn');
  document.getElementById('list-title').textContent = entries.length
    ? 'Liste (' + entries.length + ')'
    : 'Liste';
  clearB.style.display = entries.length ? '' : 'none';
  if (!entries.length) {
    el.innerHTML = '<div class="empty-state">Aucun article — Actualiser synchronise les articles du jour</div>';
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  el.innerHTML = entries.map((e) => {
    const domain = (() => { try { return new URL(e.url).hostname.replace(/^www\./, ''); } catch { return e.url; } })();
    const ind = e.indicateur || '';
    const ctr = (ind.match(/CDI|CDD|Freelance|Alternance|Stage/) || [''])[0];
    const emj = ind.replace(/CDI|CDD|Freelance|Alternance|Stage/g, '').trim();
    return '<div class="entry" data-id="' + e.id + '">' +
      '<div class="entry-badges">' +
      (e.langue ? '<span class="badge">' + e.langue + '</span>' : '') +
      (emj ? '<span class="badge">' + emj + '</span>' : '') +
      (ctr ? '<span class="badge ctr">' + ctr + '</span>' : '') +
      (e.categorie ? '<span class="badge cat">' + e.categorie + '</span>' : '') +
      '</div>' +
      '<span class="entry-url" title="' + (e.title || e.url) + '">' + domain + '</span>' +
      '<a href="' + e.url + '" target="_blank" rel="noopener" class="entry-link" aria-label="Ouvrir" title="Ouvrir">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
      '</a>' +
      '<button type="button" class="edit-btn" data-id="' + e.id + '" aria-label="Éditer" title="Éditer">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +
      '</button>' +
      '<button type="button" class="del-btn" data-id="' + e.id + '" aria-label="Supprimer" title="Supprimer">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
      '</button></div>';
  }).join('');

  el.querySelectorAll('.del-btn').forEach(b => {
    b.addEventListener('click', () => deleteArticle(b.dataset.id));
  });
  el.querySelectorAll('.edit-btn').forEach(b => {
    b.addEventListener('click', () => {
      const article = entries.find(e => e.id === b.dataset.id);
      if (article) fillFormFromArticle(article);
    });
  });
}

document.getElementById('copy-btn').addEventListener('click', () => {
  const tsv = entries.map(e =>
    (e.title ? e.title.replace(/\t|\n/g, ' ') : '') + '\t' +
    (e.langue || '') + '\t' +
    (e.indicateur || '') + '\t' +
    e.url + '\t' +
    (e.categorie || '') + ' '
  ).join('\n');
  navigator.clipboard.writeText(tsv).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('ok');
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copié !';
    setTimeout(() => {
      btn.classList.remove('ok');
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copier le TSV pour Google Sheets';
    }, 2000);
  });
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
syncColC();
const params = new URLSearchParams(window.location.search);
const prefilledUrl = params.get('url');
if (prefilledUrl) {
  const cleaned = cleanUrl(prefilledUrl);
  urlInput.value = cleaned;
  applyDetection(cleaned);
  handleUrlChange();
}
loadEntries();
</script>
</body>
</html>
